# The mise task namespace for the `tuatha/` project.
#
# Scope boundary (per the 2026-08-25 cianfhoghlaim -> tuatha merge):
# tuatha CONSUMES the education corpus; it does not MANUFACTURE it.
# The Class A-E media-descriptor ingests and the government DLT
# ingests therefore live in cianfhoghlaim as `data:media-intel:*`
# and are deliberately NOT duplicated here.
#
#   cianfhoghlaim  ->  data:media-intel:comics-hickman
#                      data:media-intel:prose-wot
#                      data:media-intel:animation-atla
#                      data:media-intel:games-capture
#                      data:media-intel:educational-bodies
#                      data:media-intel:uk-government
#                      data:media-intel:ie-government
#                      data:media-intel:crown-deps-government
#
# See tuatha/corpus/CONTRACT.md for the read/write boundary.

[tasks."tuatha:install"]
description = "Install the tuatha project dependencies (uv-managed)."
run = "uv sync --extra dev"

[tasks."tuatha:test"]
description = "Run the test suite (pytest). Tests live at tests/."
depends = ["tuatha:install"]
run = "uv run pytest"

[tasks."tuatha:lint"]
description = "Run ruff over the tuatha package and the tests."
depends = ["tuatha:install"]
run = "uv run ruff check tuatha/ tests/"

[tasks."tuatha:typecheck"]
description = "Run mypy over the tuatha package."
depends = ["tuatha:install"]
run = "uv run mypy tuatha/"

[tasks."tuatha:openspec-validate"]
description = "Run openspec validate --strict on the consolidation change."
run = "openspec validate 2026-08-25-tuatha-british-isles-mmo-consolidation-v1 --strict"

[tasks."tuatha:doctor"]
description = "Boundary + hygiene gate: no cross-repo imports, no dangling mise task targets, licence coherent."
run = "uv run python scripts/doctor.py"
