[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuatha"
version = "0.1.0"
description = "The British Isles Formative Assessment MMO — the canonical implementation of the cianfhoghlaim-educational-mmo spec"
readme = "README.md"
requires-python = ">=3.11"
# BUSL-1.1 (CIANCHOSAINT edition), matching cianchosaint + ciandlithe.
# Change Date 2029-08-25, after which it converts to Apache-2.0.
license = "BUSL-1.1"
license-files = ["LICENSE.md"]
authors = [
    { name = "Cian Mac an Déisigh Uí Liatháin", email = "cian@cianfhoghlaim.ie" },
]
keywords = [
    "education",
    "ncca",
    "leaving-certificate",
    "british-isles",
    "formative-assessment",
    "adk",
    "baml",
    "dlt",
    "dagster",
    "cocoindex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
# Core = what tuatha actually imports. Everything aspirational lives in
# an extra, so `uv sync` succeeds on a clean checkout. Before this split
# the dependency set was unsatisfiable and had never been installed.
dependencies = [
    # The BAML client (auto-generated by the baml:generate codegen step)
    "baml-py>=0.210",
    # The Google ADK framework — 33 import sites, the agent surface
    "google-adk>=1.10",
    # LanceDB — the corpus + ANAM read/write surface
    "lancedb>=0.20",
    # The DLT + Dagster + CocoIndex pipeline stack
    "dlt>=1.4",
    "dagster>=1.10",
    # v1 floor: tuatha/cocoindex/ uses the v1 App API, not v0 flow_def.
    "cocoindex>=1.0",
    # The Pydantic v2 base models
    "pydantic>=2.10",
    # The dotenv + structlog
    "python-dotenv>=1.0",
    "structlog>=24.0",
    # The websockets + HTTP client
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hatchling>=1.25",
    "build>=1.2",
    "twine>=5.0",
    "pre-commit>=4.0",
]
# Observability. Needed from P2 (the ANAM capture pipeline traces to
# Langfuse and gates on a RAGAS asset check).
observability = [
    "langfuse>=3.0",
    "mlflow>=2.20",
    "ragas>=0.3",
]
# The LiteLLM gateway client. tuatha reaches the gateway over HTTP via
# `tuatha.config.LiteLlmConfig`, so the SDK is only needed for direct use.
gateway = [
    "litellm>=1.50",
]
# The memory stack.
#
# WARNING: `letta` is deliberately NOT included. letta pins
# `opentelemetry-sdk==1.30.0` exactly, while `google-adk` requires
# `opentelemetry-sdk>=1.31.0`. The two cannot be co-installed. Since
# letta has zero import sites in this repo and google-adk has 33,
# google-adk wins. Do not re-add letta to any extra that is installed
# alongside the core dependencies.
memory = [
    "cognee>=0.3",
    # 0.29.3 is the latest published release; a >=0.30 floor is unsatisfiable.
    "graphiti-core>=0.29",
]
baml = [
    "baml-py>=0.210",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings>=0.25",
    "mkdocstrings-python>=1.10",
]


[project.urls]
Homepage = "https://github.com/cianmacandeisigh/tuatha"
Documentation = "https://github.com/cianmacandeisigh/tuatha#readme"
Repository = "https://github.com/cianmacandeisigh/tuatha"
Issues = "https://github.com/cianmacandeisigh/tuatha/issues"
Changelog = "https://github.com/cianmacandeisigh/tuatha/releases"

[tool.hatch.build.targets.wheel]
packages = ["tuatha"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tuatha", "tests"]
extend-exclude = [
    "tuatha/old",
    "tuatha/baml/.baml_client",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do-not-perform-function-calls-in-argument-defaults
    "RUF012",  # mutable-class-default-attribute
    "SIM108",  # use ternary operator
    "SIM117",  # combine-with-statement
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]
# marimo generates its cells as `def __(...)`, and a bare expression on
# the last line of a cell is how a cell renders its output. Both read as
# defects to ruff and are required by the notebook format.
"tuatha/notebooks/*" = ["N807", "B018"]
# UP042 wants `StrEnum` instead of `(str, Enum)`. That changes what
# `str(Member)` returns, and these enums are serialised into credential
# records — a silent format change in the badge ledger is not worth a
# style fix.
"tuatha/badges/schema.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests (require a live stack)",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["tuatha"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "pass",
]
show_missing = true
fail_under = 80
