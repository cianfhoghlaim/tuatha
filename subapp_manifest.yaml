# subapp_manifest.yaml — the 3-tier subapp declaration.
# Read by cianfhoghlaim/scripts/sync/sync_subapps.py.
# See openspec/specs/web-frontend-3-tier/spec.md for the full spec.

api_version: cianfhoghlaim/v1
kind: subapp

metadata:
  name: tuatha
  display_name: The British Isles Formative Assessment MMO
  upstream_repo: github.com/cianfhoghlaim/tuatha
  upstream_branch: main
  parent: cianfhoghlaim

spec:
  # TIER 3 is the only valid value for subapps.
  tier: 3

  # The 5 valid pace layers: daily | weekly | monthly | quarterly | per_openspec_change
  pace_layer: per_openspec_change

  # The 4 valid deployment targets: gcp_cloud_run | bare_metal | private_cloud | parent
  deployment_target: parent

  # The 5 valid licences: MIT | BUSL-1.1 | BUSL-1.1-v2-cianchosaint | BUSL-1.1-v2-ciandlithe | pending
  # Per the tuatha/ LICENSE file (MIT License, Copyright 2026 Cian Mac an Déisigh Uí Liatháin).
  licence: MIT

  # The TIER 1 packages this subapp uses.
  # Valid values: model-registry | fleet | theming | agui-bridge | baml-helpers |
  #               observability | db | auth | ui-kit | dlt-common
  depends_on_tier_1:
    - model-registry
    - fleet
    - theming
    - agui-bridge
    - observability
    - dlt-common
    - auth
    - baml-helpers
    - ui-kit
    - db

  # The BAML extract surfaces (in the subapp).
  baml_surfaces:
    - tuatha

  # The openspec change IDs to mirror.
  openspec_changes:
    - 2026-08-25-tuatha-british-isles-mmo-consolidation-v1
    - 2026-08-26-tuatha-multimodel-2d-graphics-and-earn-pipeline-v1
    - 2026-08-26-tuatha-subject-expansion-to-14-v1

  # The 14 subjects covered (8 NCCA + 6 NCCA-adjacent).
  subjects:
    - mathematics
    - applied_mathematics
    - chemistry
    - geography
    - history
    - english
    - gaeilge
    - computer_science
    - accounting
    - biology
    - business
    - french
    - irish
    - physics
